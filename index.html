<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde0b6">
<meta name="description" content="貼り付けたURLを段落ごとに読みやすく整形するツール">
<title>ポータルサイト</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./shisa-maskable.png">
<link rel="apple-touch-icon" href="./shisa-maskable.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde0b6;
  --card:#fffaf1;
  --text:#282018;
  --sub:#776a5e;
  --border:#8c7762;
  --btn:#3c3026;
  --btn-soft:#fff4df;
  --ok:#94714f;
  --top-pad:max(9px,env(safe-area-inset-top));
  --action-h:76px;
  --footer-h:126px;
  --bottom-gap:var(--top-pad);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Yomogi","Klee One","Yu Mincho",cursive;
  background:var(--bg);
  color:var(--text);
}
button,textarea,input{font:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{
  height:100dvh;
  max-width:820px;
  margin:0 auto;
  padding:var(--top-pad) 10px calc(var(--footer-h) + env(safe-area-inset-bottom) + var(--bottom-gap) + 10px);
  display:flex;
  flex-direction:column;
  gap:9px;
  overflow:hidden;
}
.header{display:flex;align-items:center;min-height:36px;padding:0 3px}
h1{margin:0;font-size:1.18rem;font-weight:700;letter-spacing:.02em}
.card{
  min-height:0;
  background:rgba(255,250,241,.96);
  border:2px solid rgba(140,119,98,.42);
  border-radius:18px;
  padding:11px;
  box-shadow:0 4px 14px rgba(88,58,31,.10);
  display:grid;
  gap:7px;
  overflow:hidden;
}
.result-card{
  flex:none;
  height:calc(50dvh - var(--top-pad) - 92px - (var(--bottom-gap) / 2));
  grid-template-rows:auto minmax(0,1fr);
}
.input-card{
  flex:1;
  min-height:0;
  grid-template-rows:auto minmax(0,1fr);
}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;min-height:30px;gap:8px}
label{font-size:1.02rem;font-weight:700;letter-spacing:.02em}
textarea{
  width:100%;
  height:100%;
  min-height:0;
  resize:none;
  border:2px solid rgba(140,119,98,.42);
  border-radius:13px;
  padding:10px 12px;
  font-size:1rem;
  line-height:1.55;
  background:#fffdf8;
  color:var(--text);
  outline:none;
}
textarea:focus{border-color:var(--border);box-shadow:0 0 0 3px rgba(140,119,98,.14)}
textarea::placeholder{color:#9b8f84;opacity:1}
.action-strip{
  flex:none;
  width:100%;
  height:var(--action-h);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.action-btn,.count-btn{
  min-width:0;
  height:var(--action-h);
  padding:7px 3px;
  border:2px solid var(--btn);
  border-radius:13px;
  font-size:clamp(.72rem,3.1vw,.92rem);
  line-height:1.25;
  font-weight:700;
  letter-spacing:0;
  color:#fff;
  background:var(--btn);
  box-shadow:0 3px 0 rgba(60,48,38,.24);
}
.count-btn{grid-column:2;color:var(--btn);background:#fffaf1;cursor:default}
.copy-btn{grid-column:3}
.share-btn{grid-column:4;color:var(--btn);background:#f6bf83}
.clear-btn{grid-column:5;color:var(--btn);background:var(--btn-soft)}
.action-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,48,38,.24)}
.status{color:var(--ok);font-size:.82rem;font-weight:700;white-space:nowrap}
.option{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:.86rem;white-space:nowrap}
.option input{width:19px;height:19px;margin:0;accent-color:var(--btn)}
.option label{font-size:.86rem;font-weight:700}
.quick-links{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:var(--bottom-gap);
  width:min(100%,820px);
  height:calc(var(--footer-h) + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  background:rgba(253,224,182,.97);
  border-top:2px solid rgba(140,119,98,.5);
  box-shadow:0 -5px 16px rgba(88,58,31,.12);
  backdrop-filter:blur(8px);
}
.quick-item{
  min-width:0;
  display:grid;
  grid-template-rows:27px minmax(0,1fr);
  gap:4px;
  justify-items:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.quick-item:active .quick-label,.quick-item:active .quick-link{background:#f9ebd5}
.quick-label{
  width:100%;
  height:27px;
  padding:2px 3px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border:2px solid rgba(140,119,98,.55);
  border-radius:8px;
  background:#fffaf1;
  font-size:.72rem;
  line-height:1.1;
  font-weight:700;
}
.quick-link{
  min-width:0;
  width:min(100%,83px);
  aspect-ratio:1;
  padding:0;
  display:grid;
  place-items:center;
  border:2px solid rgba(140,119,98,.55);
  border-radius:13px;
  color:var(--text);
  background:#fffaf1;
  overflow:hidden;
}
.quick-link:active{background:#f9ebd5}
.quick-icon-frame{
  width:100%;
  height:100%;
  border-radius:8px;
  overflow:hidden;
  display:grid;
  place-items:center;
}
.quick-icon{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:50% 50%;
  display:block;
}
.auth-gate{
  position:fixed;
  z-index:1000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
}
.auth-gate.is-open{display:flex}
.auth-box{
  width:min(100%,360px);
  padding:20px;
  display:grid;
  gap:12px;
  background:#fffaf1;
  border:2px solid rgba(140,119,98,.55);
  border-radius:18px;
  box-shadow:0 7px 22px rgba(88,58,31,.16);
}
.auth-title{margin:0;text-align:center;font-size:1.1rem;font-weight:700}
.auth-input{
  width:100%;
  height:48px;
  padding:8px 12px;
  border:2px solid rgba(140,119,98,.55);
  border-radius:12px;
  background:#fffdf8;
  color:var(--text);
  font-size:1rem;
  outline:none;
}
.auth-input:focus{border-color:var(--border);box-shadow:0 0 0 3px rgba(140,119,98,.14)}
.auth-submit{
  height:48px;
  border:2px solid var(--btn);
  border-radius:12px;
  background:var(--btn);
  color:#fff;
  font-weight:700;
}
.auth-error{min-height:1.2em;text-align:center;color:#9a3d31;font-size:.88rem;font-weight:700}
@media(max-width:380px){
  .app{padding-left:7px;padding-right:7px;gap:7px}
  .card{padding:8px}
  .action-strip{gap:5px}
  .action-btn{font-size:.7rem}
  .quick-links{gap:5px;padding-left:5px;padding-right:5px}
}
@media(max-height:700px){
  h1{font-size:1.04rem}
  .card{padding:8px;gap:5px}
  label{font-size:.94rem}
  textarea{font-size:.92rem;padding:7px 9px}
}
</style>
</head>
<body>
<div class="auth-gate" id="authGate" aria-modal="true" role="dialog" aria-labelledby="authTitle">
  <form class="auth-box" id="authForm">
    <h2 class="auth-title" id="authTitle">パスワード</h2>
    <input class="auth-input" id="authPassword" type="password" inputmode="numeric" autocomplete="current-password" aria-label="パスワード" placeholder="パスワードを入力">
    <button class="auth-submit" type="submit">ログイン</button>
    <div class="auth-error" id="authError" aria-live="polite"></div>
  </form>
</div>
<main class="app">
  <header class="header" aria-hidden="true"></header>

  <section class="card result-card">
    <div class="section-head">
      <label for="output">▶整形結果</label>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <textarea id="output" readonly placeholder="貼り付けた文字列の&#10;段落ごとに改行を追加する"></textarea>
  </section>

  <div class="action-strip">
    <button class="count-btn" id="count" type="button" aria-live="polite">0件</button>
    <button class="action-btn copy-btn" id="copyBtn" type="button">整形コピー</button>
    <button class="action-btn share-btn" id="shareBtn" type="button">共有サイト</button>
    <button class="action-btn clear-btn" id="clearBtn" type="button">クリア</button>
  </div>

  <section class="card input-card">
    <div class="section-head">
      <label for="input">▶貼りつけ</label>
      <div class="option">
        <input type="checkbox" id="blankLine" checked>
        <label for="blankLine">空行あり</label>
      </div>
    </div>
    <textarea id="input" placeholder="1&#10;https://example.com/aaa&#10;2&#10;https://example.com/bbb"></textarea>
  </section>
</main>

<nav class="quick-links" aria-label="固定リンク">
  <div class="quick-item" role="button" tabindex="0">
    <div class="quick-label">すぷし</div>
    <button class="quick-link" type="button" data-url="https://docs.google.com/spreadsheets/d/1ctavkgr8xwdAkInTCMifZzfIYvzkeuYX/edit?usp=drivesdk&amp;ouid=111068839716185453387&amp;rtpof=true&amp;sd=true" aria-label="すぷしを開く">
      <span class="quick-icon-frame"><img class="quick-icon" src="./link-1-transparent.png" alt=""></span>
    </button>
  </div>
  <div class="quick-item" role="button" tabindex="0">
    <div class="quick-label">画像加工</div>
    <button class="quick-link" type="button" data-url="https://yahoo-framev2.45kikurage.workers.dev" aria-label="画像加工を開く">
      <span class="quick-icon-frame"><img class="quick-icon" src="./link-2-transparent.png" alt=""></span>
    </button>
  </div>
  <div class="quick-item" role="button" tabindex="0">
    <div class="quick-label">すくしょ</div>
    <button class="quick-link" type="button" data-url="https://coupon-capture.45kikurage.workers.dev" aria-label="すくしょを開く">
      <span class="quick-icon-frame"><img class="quick-icon" src="./link-3-transparent.png" alt=""></span>
    </button>
  </div>
  <div class="quick-item" role="button" tabindex="0">
    <div class="quick-label">リンク4</div>
    <button class="quick-link" type="button" data-url="" aria-label="リンク4・リンク先未設定">
      <span class="quick-icon-frame"><img class="quick-icon" src="./link-4-transparent.png" alt=""></span>
    </button>
  </div>
</nav>

<script>
const input=document.getElementById('input');
const output=document.getElementById('output');
const blankLine=document.getElementById('blankLine');
const copyBtn=document.getElementById('copyBtn');
const shareBtn=document.getElementById('shareBtn');
const clearBtn=document.getElementById('clearBtn');
const status=document.getElementById('status');
const count=document.getElementById('count');
const authGate=document.getElementById('authGate');
const authForm=document.getElementById('authForm');
const authPassword=document.getElementById('authPassword');
const authError=document.getElementById('authError');
const AUTH_KEY='portal-auth-ok-v1';
const AUTH_PASSWORD='19781211';

function openAuthIfNeeded(){
  if(localStorage.getItem(AUTH_KEY)==='1') return;
  authGate.classList.add('is-open');
  document.body.style.overflow='hidden';
  setTimeout(()=>authPassword.focus(),0);
}
authForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(authPassword.value===AUTH_PASSWORD){
    localStorage.setItem(AUTH_KEY,'1');
    authGate.classList.remove('is-open');
    document.body.style.overflow='';
    authError.textContent='';
    authPassword.value='';
  }else{
    authError.textContent='パスワードが違います';
    authPassword.select();
  }
});

function normalizeMarkdownUrls(text){
  return text.replace(/\[([^\]]*https?:\/\/[^\]]+)\]\((https?:\/\/[^)]+)\)/g,'$2');
}
function extractPairs(text){
  text=normalizeMarkdownUrls(text).replace(/\r\n?/g,'\n').replace(/\u200b/g,'');
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const pairs=[]; let pendingNum=null;
  for(const line of lines){
    const sameLine=line.match(/^(\d+)\s+(https?:\/\/[^\s<>"']+)/i);
    if(sameLine){pairs.push({num:sameLine[1],url:sameLine[2]});pendingNum=null;continue}
    const numMatch=line.match(/^(\d+)\s*$/);
    if(numMatch){pendingNum=numMatch[1];continue}
    const urlMatch=line.match(/(https?:\/\/[^\s<>"']+)/i);
    if(urlMatch){pairs.push({num:pendingNum,url:urlMatch[1]});pendingNum=null}
  }
  if(pairs.length===0){
    const urls=text.match(/https?:\/\/[^\s<>"')\]]+/gi)||[];
    urls.forEach((url,i)=>pairs.push({num:String(i+1),url}));
  }
  return pairs;
}
function format(){
  const pairs=extractPairs(input.value);
  const sep=blankLine.checked?'\n\n':'\n';
  output.value=pairs.map((p,i)=>`${p.num||String(i+1)}${sep}${p.url}`).join(sep);
  count.textContent=`${pairs.length}件`;
  status.textContent='';
}
function clearAll(){
  input.value='';
  output.value='';
  count.textContent='0件';
  status.textContent='';
  input.focus();
}

input.addEventListener('input',format);
blankLine.addEventListener('change',format);
clearBtn.addEventListener('click',clearAll);
copyBtn.addEventListener('click',async()=>{
  if(!output.value){status.textContent='内容なし';return}
  try{await navigator.clipboard.writeText(output.value);status.textContent='コピーしました！'}
  catch(e){output.removeAttribute('readonly');output.select();document.execCommand('copy');output.setAttribute('readonly','');status.textContent='コピーしました！'}
  setTimeout(()=>status.textContent='',1800);
});
shareBtn.addEventListener('click',()=>{
  window.open('https://writening.net/','_blank','noopener,noreferrer');
});
function openQuickItem(item){
  const button=item.querySelector('.quick-link');
  const url=button?.dataset.url||'';
  if(url){window.open(url,'_blank','noopener,noreferrer')}
  else{
    status.textContent='リンク先は未設定です';
    setTimeout(()=>status.textContent='',1800);
  }
}
document.querySelectorAll('.quick-item').forEach(item=>{
  item.addEventListener('click',e=>{
    if(e.target.closest('.quick-item')===item) openQuickItem(item);
  });
  item.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();openQuickItem(item)}
  });
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
openAuthIfNeeded();
format();
</script>
</body>
</html>
