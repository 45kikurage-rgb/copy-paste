<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7d7a4">
<title>URL改行整形ツール</title>
<style>
:root{
  --bg:#f7d7a4;
  --panel:#fbf8f1;
  --ink:#3b3028;
  --line:#c9c0b4;
  --accent:#f2b978;
  --dark:#43372e;
  --white:#fffdf8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:14px 16px 20px}
.screen{display:block}
.screen[hidden]{display:none!important}
.card{background:rgba(255,253,248,.9);border:3px solid var(--line);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:0 4px 0 rgba(70,54,40,.10)}
.section-title{font-size:25px;font-weight:700;margin-bottom:18px}
textarea{width:100%;resize:none;border:3px solid #d5cec2;border-radius:22px;background:#fffefa;padding:18px;font-size:22px;line-height:1.75;outline:none}
#output{height:400px}
#input{height:260px}
textarea::placeholder{color:#aaa29b}
.action-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:12px;margin:2px 0 18px}
.action-btn,.count-box{
  min-height:128px;border:4px solid var(--ink);border-radius:22px;background:#fffaf0;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;
  box-shadow:0 5px 0 rgba(70,54,40,.18);padding:8px
}
.action-btn.dark{background:var(--dark);color:white}
.action-btn.accent{background:var(--accent)}
.calc-button{flex-direction:column;gap:5px;background:#f5b86f}
.calc-icon{font-size:34px;line-height:1}
.count-box{font-variant-numeric:tabular-nums}
.paste-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.paste-title{font-size:25px;font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:19px;white-space:nowrap}
.check input{width:28px;height:28px;accent-color:var(--dark)}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.link-tile{min-height:112px;border:3px solid var(--line);border-radius:18px;background:#fffaf3;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:inherit;font-size:18px}
.status{min-height:24px;text-align:center;font-size:15px}

/* calculator */
.calc-page{padding-bottom:18px}
.calc-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:12px}
.back-small,.calc-title,.calc-head-icon{border:3px solid var(--ink);background:#fffaf0;min-height:74px;display:flex;align-items:center;justify-content:center;border-radius:18px;font-weight:700}
.back-small{padding:0 20px;font-size:24px}
.calc-title{font-size:34px}
.calc-head-icon{width:76px;font-size:34px;background:var(--accent)}
.calc-note{background:var(--dark);color:white;border:3px solid var(--ink);border-radius:16px;padding:18px;text-align:center;font-size:21px;line-height:1.6;margin-bottom:12px}
.calc-table{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff8e8;margin-bottom:14px}
.calc-row{display:grid;grid-template-columns:1fr 1.15fr;min-height:78px;border-bottom:1px solid #9f968b}
.calc-row:last-child{border-bottom:none}
.calc-row.head{background:var(--dark);color:white;min-height:64px;font-weight:700}
.calc-cell{display:flex;align-items:center;justify-content:center;padding:8px;font-size:24px}
.calc-cell+ .calc-cell{border-left:1px solid #9f968b}
.qty-input{width:95px;max-width:52%;height:54px;border:3px solid var(--ink);border-radius:10px;background:white;text-align:center;font-size:24px}
.calc-price{font-size:27px;font-weight:700}
.unit-panel{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--dark);color:white;margin-bottom:8px}
.unit-row{display:grid;grid-template-columns:150px 1fr 55px;align-items:center;min-height:86px}
.unit-row+ .unit-row{border-top:1px solid #aaa39a}
.unit-label{text-align:center;font-size:25px}
.unit-input,.unit-result{height:58px;margin:10px;border:0;border-radius:8px;background:white;color:#222;text-align:right;padding:0 16px;font-size:28px;min-width:0}
.unit-result{background:#ddd;display:flex;align-items:center;justify-content:flex-end}
.unit-yen{text-align:center;font-size:24px}
.unit-help{font-size:17px;padding:10px 8px 16px}
.mascot-area{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:12px;margin:12px 0}
.mascot-area img{width:100%;max-width:220px;display:block;border-radius:12px}
.bubble{background:#fffdf8;border:4px solid var(--ink);border-radius:14px;padding:24px;font-size:21px;font-weight:700;line-height:1.55}
.back-wide{width:100%;min-height:96px;border:4px solid var(--ink);border-radius:18px;background:var(--dark);color:white;font-size:30px;font-weight:700}

@media(max-width:640px){
  .app{padding:12px 14px 18px}
  .card{padding:16px;border-radius:24px}
  .section-title,.paste-title{font-size:22px}
  #output{height:42vh;min-height:300px}
  #input{height:240px}
  .action-row{gap:8px}
  .action-btn,.count-box{min-height:116px;border-width:3px;border-radius:18px;font-size:18px;padding:5px}
  .calc-icon{font-size:29px}
  .calc-header{grid-template-columns:92px 1fr 68px}
  .back-small{font-size:19px;padding:0 8px}
  .calc-title{font-size:29px}
  .calc-note{font-size:18px}
  .calc-cell{font-size:22px}
  .unit-row{grid-template-columns:105px 1fr 42px}
  .unit-label{font-size:20px}
  .unit-input,.unit-result{font-size:23px;margin:9px}
  .mascot-area{grid-template-columns:140px 1fr}
  .bubble{font-size:18px;padding:18px}
}
@media(max-width:440px){
  .app{padding-left:10px;padding-right:10px}
  .action-row{gap:6px}
  .action-btn,.count-box{min-height:102px;font-size:16px;border-radius:16px}
  .calc-icon{font-size:26px}
  .card{padding:14px}
  textarea{font-size:18px;padding:15px}
  #output{height:390px}
  #input{height:250px}
  .calc-header{grid-template-columns:82px 1fr 58px}
  .back-small{font-size:17px}
  .calc-title{font-size:26px}
  .calc-head-icon{width:58px;font-size:28px}
  .calc-row{min-height:70px}
  .calc-cell{font-size:20px}
  .qty-input{width:80px;height:50px}
  .unit-row{grid-template-columns:90px 1fr 38px}
  .unit-label{font-size:18px}
  .mascot-area{grid-template-columns:115px 1fr}
  .bubble{font-size:16px;padding:14px}
}
</style>
</head>
<body>
<main class="app">

<section id="homeScreen" class="screen">
  <section class="card">
    <div class="section-title">▶整形結果</div>
    <textarea id="output" readonly placeholder="貼り付けた文字列の&#10;段落ごとに改行を追加する"></textarea>
  </section>

  <div class="action-row">
    <button id="openCalc" class="action-btn calc-button" type="button" aria-label="計算表を開く">
      <span class="calc-icon">🧮</span><span>計算表</span>
    </button>
    <div id="count" class="count-box">０件</div>
    <button id="copyBtn" class="action-btn dark" type="button">コピー</button>
    <button id="shareBtn" class="action-btn accent" type="button">共有/<br>サイト</button>
    <button id="clearBtn" class="action-btn" type="button">クリア</button>
  </div>
  <div id="status" class="status" aria-live="polite"></div>

  <section class="card">
    <div class="paste-head">
      <div class="paste-title">▶貼りつけ</div>
      <label class="check"><input id="blankLine" type="checkbox" checked>空行あり</label>
    </div>
    <textarea id="input" placeholder="1&#10;https://example.com/aaa&#10;2&#10;https://example.com/bbb"></textarea>
  </section>

  <nav class="links" aria-label="リンク">
    <a class="link-tile" href="#" id="link1">すぷし</a>
    <a class="link-tile" href="#" id="link2">画像加工</a>
    <a class="link-tile" href="#" id="link3">すくしょ</a>
    <a class="link-tile" href="#" id="link4">リンク4</a>
  </nav>
</section>

<section id="calcScreen" class="screen calc-page" hidden>
  <header class="calc-header">
    <button class="back-small js-back" type="button">◀ 戻る</button>
    <div class="calc-title">計算表</div>
    <div class="calc-head-icon">🧮</div>
  </header>

  <div class="calc-note">下の単価を入力すると<br>各本数の金額が自動で計算されます。</div>

  <div class="calc-table">
    <div class="calc-row head">
      <div class="calc-cell">本数</div>
      <div class="calc-cell">金額（自動計算）</div>
    </div>
    <div class="calc-row"><div class="calc-cell">5本</div><div class="calc-cell calc-price" data-qty="5">0円</div></div>
    <div class="calc-row"><div class="calc-cell">10本</div><div class="calc-cell calc-price" data-qty="10">0円</div></div>
    <div class="calc-row"><div class="calc-cell">20本</div><div class="calc-cell calc-price" data-qty="20">0円</div></div>
    <div class="calc-row"><div class="calc-cell">24本</div><div class="calc-cell calc-price" data-qty="24">0円</div></div>
    <div class="calc-row">
      <div class="calc-cell"><strong>自由入力</strong>&nbsp;<input id="freeQty" class="qty-input" type="number" min="0" inputmode="numeric" aria-label="自由入力の本数">&nbsp;本</div>
      <div id="freePrice" class="calc-cell calc-price">0円</div>
    </div>
  </div>

  <div class="unit-panel">
    <div class="unit-row">
      <div class="unit-label">単価</div>
      <input id="unitPrice" class="unit-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="単価">
      <div class="unit-yen">円</div>
    </div>
    <div class="unit-row">
      <div class="unit-label">× 80%</div>
      <output id="unit80" class="unit-result">0</output>
      <div class="unit-yen">円</div>
    </div>
  </div>
  <div class="unit-help">※ 単価の80%の金額を表示します</div>

  <div class="mascot-area">
    <img src="./calculator-mascot.png" alt="計算表のキャラクター">
    <div class="bubble">単価を入力すると<br>各本数の金額が自動で計算されるよ！</div>
  </div>

  <button class="back-wide js-back" type="button">◀ 戻る</button>
</section>

</main>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const blankLine = document.getElementById('blankLine');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const status = document.getElementById('status');
const count = document.getElementById('count');

function toFullWidthDigits(value){
  return String(value).replace(/[0-9]/g, d => String.fromCharCode(d.charCodeAt(0) + 0xFEE0));
}
function normalizeMarkdownUrls(text){
  return text.replace(/\[([^\]]*https?:\/\/[^\]]+)\]\((https?:\/\/[^)]+)\)/g,'$2');
}
function extractPairs(text){
  text = normalizeMarkdownUrls(text).replace(/\r\n?/g,'\n').replace(/\u200b/g,'');
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const pairs=[]; let pendingNum=null;
  for(const line of lines){
    const sameLine=line.match(/^(\d+)\s+(https?:\/\/[^\s<>"']+)/i);
    if(sameLine){pairs.push({num:sameLine[1],url:sameLine[2]});pendingNum=null;continue}
    const numMatch=line.match(/^(\d+)\s*$/);
    if(numMatch){pendingNum=numMatch[1];continue}
    const urlMatch=line.match(/(https?:\/\/[^\s<>"']+)/i);
    if(urlMatch){pairs.push({num:pendingNum,url:urlMatch[1]});pendingNum=null}
  }
  if(pairs.length===0){
    const urls=text.match(/https?:\/\/[^\s<>"')\]]+/gi)||[];
    urls.forEach((url,i)=>pairs.push({num:String(i+1),url}));
  }
  return pairs;
}
function format(){
  const pairs=extractPairs(input.value);
  const sep=blankLine.checked?'\n\n':'\n';
  output.value=pairs.map((p,i)=>`${p.num||String(i+1)}${sep}${p.url}`).join(sep);
  count.textContent=`${toFullWidthDigits(pairs.length)}件`;
  status.textContent='';
}
input.addEventListener('input',format);
blankLine.addEventListener('change',format);

clearBtn.addEventListener('click',()=>{
  input.value=''; output.value=''; count.textContent='０件'; status.textContent=''; input.focus();
});
copyBtn.addEventListener('click',async()=>{
  if(!output.value){status.textContent='内容なし';return}
  try{
    await navigator.clipboard.writeText(output.value);
  }catch(e){
    output.removeAttribute('readonly'); output.select(); document.execCommand('copy'); output.setAttribute('readonly','');
  }
  status.textContent='コピーしました！';
  setTimeout(()=>status.textContent='',1800);
});
document.getElementById('shareBtn').addEventListener('click', async()=>{
  if(navigator.share){
    try{await navigator.share({text:output.value || input.value || ''});}catch(e){}
  }else{
    status.textContent='この端末では共有機能を利用できません';
    setTimeout(()=>status.textContent='',1800);
  }
});

const homeScreen=document.getElementById('homeScreen');
const calcScreen=document.getElementById('calcScreen');
document.getElementById('openCalc').addEventListener('click',()=>{
  homeScreen.hidden=true; calcScreen.hidden=false; window.scrollTo(0,0);
});
document.querySelectorAll('.js-back').forEach(btn=>btn.addEventListener('click',()=>{
  calcScreen.hidden=true; homeScreen.hidden=false; window.scrollTo(0,0);
}));

const unitPrice=document.getElementById('unitPrice');
const freeQty=document.getElementById('freeQty');
const unit80=document.getElementById('unit80');
const freePrice=document.getElementById('freePrice');
const fixedPrices=[...document.querySelectorAll('.calc-price[data-qty]')];

function yen(n){
  const v=Number.isFinite(n)?Math.round(n):0;
  return `${v.toLocaleString('ja-JP')}円`;
}
function updateCalc(){
  const unit=Math.max(0, Number(unitPrice.value)||0);
  fixedPrices.forEach(el=>{
    const qty=Number(el.dataset.qty)||0;
    el.textContent=yen(qty*unit);
  });
  const fq=Math.max(0, Number(freeQty.value)||0);
  freePrice.textContent=yen(fq*unit);
  unit80.textContent=Math.round(unit*0.8).toLocaleString('ja-JP');
}
unitPrice.addEventListener('input',updateCalc);
freeQty.addEventListener('input',updateCalc);

format();
updateCalc();
</script>
</body>
</html>
