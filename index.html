<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde0b6">
<meta name="description" content="貼り付けたURLを段落ごとに読みやすく整形するツール">
<title>ポータルサイト</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./shisa-maskable.png">
<link rel="apple-touch-icon" href="./shisa-maskable.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde0b6;
  --card:#fffaf1;
  --text:#282018;
  --sub:#776a5e;
  --border:#8c7762;
  --btn:#3c3026;
  --btn-soft:#fff4df;
  --ok:#94714f;
  --top-pad:max(9px,env(safe-area-inset-top));
  --action-h:76px;
  --footer-h:126px;
  --bottom-gap:var(--top-pad);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Yomogi","Klee One","Yu Mincho",cursive;
  background:var(--bg);
  color:var(--text);
}
button,textarea,input{font:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{
  height:100dvh;
  max-width:820px;
  margin:0 auto;
  padding:var(--top-pad) 10px calc(var(--footer-h) + env(safe-area-inset-bottom) + var(--bottom-gap) + 10px);
  display:flex;
  flex-direction:column;
  gap:9px;
  overflow:hidden;
}
.header{display:flex;align-items:center;min-height:36px;padding:0 3px}
h1{margin:0;font-size:1.18rem;font-weight:700;letter-spacing:.02em}
.card{
  min-height:0;
  background:rgba(255,250,241,.96);
  border:2px solid rgba(140,119,98,.42);
  border-radius:18px;
  padding:11px;
  box-shadow:0 4px 14px rgba(88,58,31,.10);
  display:grid;
  gap:7px;
  overflow:hidden;
}
.result-card{
  flex:none;
  height:calc(50dvh - var(--top-pad) - 92px - (var(--bottom-gap) / 2));
  grid-template-rows:auto minmax(0,1fr);
}
.input-card{
  flex:1;
  min-height:0;
  grid-template-rows:auto minmax(0,1fr);
}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;min-height:30px;gap:8px}
label{font-size:1.02rem;font-weight:700;letter-spacing:.02em}
textarea{
  width:100%;
  height:100%;
  min-height:0;
  resize:none;
  border:2px solid rgba(140,119,98,.42);
  border-radius:13px;
  padding:10px 12px;
  font-size:1rem;
  line-height:1.55;
  background:#fffdf8;
  color:var(--text);
  outline:none;
}
textarea:focus{border-color:var(--border);box-shadow:0 0 0 3px rgba(140,119,98,.14)}
textarea::placeholder{color:#9b8f84;opacity:1}
.action-strip{
  flex:none;
  width:100%;
  height:var(--action-h);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.action-btn,.count-btn{
  min-width:0;
  height:var(--action-h);
  padding:7px 3px;
  border:2px solid var(--btn);
  border-radius:13px;
  font-size:clamp(.72rem,3.1vw,.92rem);
  line-height:1.25;
  font-weight:700;
  letter-spacing:0;
  color:#fff;
  background:var(--btn);
  box-shadow:0 3px 0 rgba(60,48,38,.24);
}
.calc-open-btn{grid-column:1;color:var(--btn);background:#f6bf83}
.count-btn{grid-column:2;color:var(--btn);background:#fffaf1;cursor:default}
.copy-btn{grid-column:3}
.share-btn{grid-column:4;color:var(--btn);background:#f6bf83}
.clear-btn{grid-column:5;color:var(--btn);background:var(--btn-soft)}
.action-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,48,38,.24)}
.status{color:var(--ok);font-size:.82rem;font-weight:700;white-space:nowrap}
.option{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:.86rem;white-space:nowrap}
.option input{width:19px;height:19px;margin:0;accent-color:var(--btn)}
.option label{font-size:.86rem;font-weight:700}
.quick-links{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:var(--bottom-gap);
  width:min(100%,820px);
  height:calc(var(--footer-h) + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  background:rgba(253,224,182,.97);
  border-top:2px solid rgba(140,119,98,.5);
  box-shadow:0 -5px 16px rgba(88,58,31,.12);
  backdrop-filter:blur(8px);
}
.quick-item{
  min-width:0;
  display:grid;
  grid-template-rows:27px minmax(0,1fr);
  gap:4px;
  justify-items:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.quick-item:active .quick-label,.quick-item:active .quick-link{background:#f9ebd5}
.quick-label{
  width:100%;
  height:27px;
  padding:2px 3px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border:2px solid rgba(140,119,98,.55);
  border-radius:8px;
  background:#fffaf1;
  font-size:.72rem;
  line-height:1.1;
  font-weight:700;
}
.quick-link{
  min-width:0;
  width:min(100%,83px);
  aspect-ratio:1;
  padding:0;
  display:grid;
  place-items:center;
  border:2px solid rgba(140,119,98,.55);
  border-radius:13px;
  color:var(--text);
  background:#fffaf1;
  overflow:hidden;
}
.quick-link:active{background:#f9ebd5}
.quick-icon-frame{
  width:100%;
  height:100%;
  border-radius:8px;
  overflow:hidden;
  display:grid;
  place-items:center;
}
.quick-icon{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:50% 50%;
  display:block;
}
.auth-gate{
  position:fixed;
  z-index:1000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
}
.auth-gate.is-open{display:flex}
.auth-box{
  width:min(100%,360px);
  padding:20px;
  display:grid;
  gap:12px;
  background:#fffaf1;
  border:2px solid rgba(140,119,98,.55);
  border-radius:18px;
  box-shadow:0 7px 22px rgba(88,58,31,.16);
}
.auth-title{margin:0;text-align:center;font-size:1.1rem;font-weight:700}
.auth-input{
  width:100%;
  height:48px;
  padding:8px 12px;
  border:2px solid rgba(140,119,98,.55);
  border-radius:12px;
  background:#fffdf8;
  color:var(--text);
  font-size:1rem;
  outline:none;
}
.auth-input:focus{border-color:var(--border);box-shadow:0 0 0 3px rgba(140,119,98,.14)}
.auth-submit{
  height:48px;
  border:2px solid var(--btn);
  border-radius:12px;
  background:var(--btn);
  color:#fff;
  font-weight:700;
}
.auth-error{min-height:1.2em;text-align:center;color:#9a3d31;font-size:.88rem;font-weight:700}
@media(max-width:380px){
  .app{padding-left:7px;padding-right:7px;gap:7px}
  .card{padding:8px}
  .action-strip{gap:5px}
  .action-btn{font-size:.7rem}
  .quick-links{gap:5px;padding-left:5px;padding-right:5px}
}
@media(max-height:700px){
  h1{font-size:1.04rem}
  .card{padding:8px;gap:5px}
  label{font-size:.94rem}
  textarea{font-size:.92rem;padding:7px 9px}
}

/* ===== 計算表 ===== */
.calculator-screen{
  position:fixed;
  z-index:50;
  inset:0;
  width:100%;
  height:100dvh;
  background:var(--bg);
  display:none;
  overflow:hidden;
}
.calculator-screen.is-open{display:block}
.calc-wrap{
  width:min(100%,820px);
  height:100%;
  margin:0 auto;
  padding:var(--top-pad) 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:8px;
}
.calc-top{
  display:grid;
  grid-template-columns:88px minmax(0,1fr) 62px;
  align-items:center;
  gap:7px;
}
.calc-back-top,.calc-title-box,.calc-icon-box{
  min-height:52px;
  border:2px solid var(--btn);
  border-radius:13px;
  background:#fffaf1;
  color:var(--text);
  font-weight:700;
}
.calc-back-top{font-size:.96rem}
.calc-title-box{display:grid;place-items:center;font-size:1.34rem}
.calc-icon-box{display:grid;place-items:center;background:#f6bf83}
.calculator-glyph{
  width:30px;height:35px;border:2px solid currentColor;border-radius:3px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:9px repeat(2,1fr);
  gap:2px;padding:3px;line-height:1
}
.calculator-glyph>span{grid-column:1/-1;border:1.5px solid currentColor;border-radius:1px}
.calculator-glyph>i{display:block;border:1px solid currentColor;border-radius:1px}
.calculator-glyph.action{width:27px;height:31px;margin:0 auto 3px}
.calc-table{
  min-height:0;
  border:2px solid rgba(140,119,98,.55);
  border-radius:16px;
  overflow:hidden;
  background:#fffaf1;
  display:grid;
  grid-template-rows:46px repeat(5,minmax(44px,1fr));
}
.calc-row{
  min-height:0;
  display:grid;
  grid-template-columns:42% 58%;
  border-bottom:1px solid rgba(140,119,98,.45);
}
.calc-row:last-child{border-bottom:0}
.calc-row.calc-head{background:var(--btn);color:#fff;font-weight:700}
.calc-cell{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:4px 7px;
  font-size:clamp(.98rem,4vw,1.18rem);
  font-weight:700;
}
.calc-cell + .calc-cell{border-left:1px solid rgba(140,119,98,.45)}
.calc-amount{justify-content:flex-end;padding-right:11%}
.free-qty{
  width:74px;
  max-width:58%;
  height:38px;
  border:2px solid rgba(140,119,98,.68);
  border-radius:8px;
  background:#fffdf8;
  text-align:center;
  outline:none;
}
.free-qty:focus,.unit-input:focus{border-color:var(--border);box-shadow:0 0 0 3px rgba(140,119,98,.14)}
.calc-control-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 90px;
  gap:7px;
  align-items:stretch;
}
.unit-inline{
  min-width:0;
  min-height:62px;
  border:2px solid var(--btn);
  border-radius:13px;
  background:var(--btn);
  color:#fff;
  display:grid;
  grid-template-columns:auto minmax(54px,1fr) auto auto minmax(58px,1fr) auto;
  gap:5px;
  align-items:center;
  padding:6px 7px;
}
.unit-label{font-size:clamp(.75rem,3vw,.92rem);font-weight:700;white-space:nowrap}
.unit-input,.unit-result{
  width:100%;
  min-width:0;
  height:38px;
  border:0;
  border-radius:7px;
  padding:0 6px;
  background:#fffdf8;
  color:var(--text);
  text-align:right;
  font-size:clamp(.82rem,3.3vw,1rem);
}
.unit-result{display:flex;align-items:center;justify-content:flex-end;background:#e9e1d8}
.unit-yen{font-size:.78rem;white-space:nowrap}
.calc-back-inline{
  min-height:62px;
  border:2px solid var(--btn);
  border-radius:13px;
  background:var(--btn);
  color:#fff;
  font-size:.9rem;
  font-weight:700;
}
.calc-mascot-row{
  min-height:0;
  display:grid;
  grid-template-columns:96px minmax(0,1fr);
  gap:7px;
  align-items:center;
}
.calc-mascot{
  width:96px;
  height:96px;
  object-fit:contain;
  display:block;
}
.calc-bubble{
  min-height:74px;
  display:flex;
  align-items:center;
  padding:9px 12px;
  border:2px solid rgba(140,119,98,.68);
  border-radius:13px;
  background:#fffaf1;
  font-size:clamp(.76rem,3vw,.92rem);
  line-height:1.45;
  font-weight:700;
}
@media(max-height:700px){
  .calc-wrap{gap:5px;padding-top:6px;padding-bottom:6px}
  .calc-top{grid-template-columns:80px minmax(0,1fr) 56px;gap:5px}
  .calc-back-top,.calc-title-box,.calc-icon-box{min-height:44px}
  .calc-title-box{font-size:1.12rem}
  .calculator-glyph{width:26px;height:30px}
  .calc-table{grid-template-rows:39px repeat(5,minmax(38px,1fr))}
  .calc-cell{font-size:.92rem;padding:3px 5px}
  .free-qty{height:33px;width:66px}
  .unit-inline,.calc-back-inline{min-height:54px}
  .unit-input,.unit-result{height:33px}
  .calc-mascot-row{grid-template-columns:78px minmax(0,1fr)}
  .calc-mascot{width:78px;height:78px}
  .calc-bubble{min-height:62px;font-size:.76rem;padding:7px 9px}
}

/* ===== 計算表 v2 / 本数管理 ===== */
.calc-v2-wrap{grid-template-rows:auto minmax(0,1fr) auto auto}
.calc-v2-wrap,.qty-manager-wrap,.calc-v2-wrap button,.calc-v2-wrap input,.qty-manager-wrap button,.qty-manager-wrap input{
  font-family:"Yomogi","Klee One","Yu Mincho",cursive;
}
.calc-v2-wrap :is(.calc-cell,.calc-half-head,.calc-v2-row,.unit-price-box,.calc-manage-inline,.calc-back-inline,.calc-bubble),
.qty-manager-wrap :is(.qty-manager-note,.qty-preset-grid button,.qty-custom-title,.qty-custom-input,.qty-manager-actions button,.calc-bubble){
  font-size:1.34rem;
  line-height:1.25;
}
.calc-dual-table{
  min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.calc-half{min-width:0;display:grid;grid-template-rows:46px minmax(0,1fr);border:2px solid rgba(140,119,98,.55);border-radius:16px;overflow:hidden;background:#fffaf1}
.calc-half-right{grid-template-rows:46px minmax(0,1fr) minmax(44px,1fr);overflow:visible;border:0;background:transparent;gap:7px}
.calc-half-right>.calc-half-head,.calc-half-right>.calc-half-body{border-left:2px solid rgba(140,119,98,.55);border-right:2px solid rgba(140,119,98,.55)}
.calc-half-right>.calc-half-head{border-top:2px solid rgba(140,119,98,.55);border-radius:16px 16px 0 0}
.calc-half-right>.calc-half-body{border-bottom:2px solid rgba(140,119,98,.55);border-radius:0 0 16px 16px;overflow:hidden;background:#fffaf1}
.calc-half-head{display:grid;grid-template-columns:42% 58%;background:var(--btn);color:#fff;font-weight:700}
.calc-half-head span,.calc-v2-row span{display:flex;align-items:center;justify-content:center;min-width:0;padding:4px}
.calc-half-head span+span,.calc-v2-row span+span{border-left:1px solid rgba(140,119,98,.45)}
.calc-half-body{display:grid;grid-template-rows:repeat(5,minmax(44px,1fr));min-height:0}
.calc-half-right .calc-half-body{grid-template-rows:repeat(4,minmax(44px,1fr))}
.calc-v2-row{display:grid;grid-template-columns:42% 58%;min-height:0;border-bottom:1px solid rgba(140,119,98,.45);font-weight:700}
.calc-v2-row:last-child{border-bottom:0}
.calc-v2-amount{justify-content:flex-end!important;padding-right:8px!important;text-align:right}
.calc-special-row{display:grid;grid-template-columns:58% 42%;align-items:center;min-height:0;border:2px solid #e6893a;border-radius:12px;background:#fff1d9;font-weight:700;overflow:hidden}
.calc-special-row span,.calc-special-amount{display:flex;align-items:center;height:100%;padding:5px 7px}
.calc-special-amount{justify-content:flex-end;border-left:1px solid rgba(140,119,98,.45)}
.calc-control-v2{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.unit-price-box,.calc-manage-inline,.calc-control-v2 .calc-back-inline{min-width:0;min-height:62px;border:2px solid var(--btn);border-radius:13px;font-weight:700}
.unit-price-box{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px;padding:6px;background:var(--btn);color:#fff}
.unit-input-v2{min-width:0;width:100%;height:40px;border:2px solid #fff;border-radius:8px;background:#fffdf8;color:var(--text);text-align:right;padding:0 5px;outline:none}
.calc-manage-inline{background:#f6bf83;color:var(--text)}
.calc-control-v2 .calc-back-inline{background:var(--btn);color:#fff}
.calc-mascot{background:var(--bg);mix-blend-mode:multiply}
.qty-manager-screen{position:fixed;z-index:55;inset:0;width:100%;height:100dvh;background:var(--bg);display:none;overflow:hidden}
.qty-manager-screen.is-open{display:block}
.qty-manager-wrap{width:min(100%,820px);height:100%;margin:0 auto;padding:var(--top-pad) 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px}
.qty-manager-card{min-height:0;overflow:auto;background:rgba(255,250,241,.7);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px}
.qty-manager-note{text-align:center;font-weight:700}
.qty-preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.qty-preset-grid button{min-height:58px;border:2px solid var(--border);border-radius:13px;background:#fffaf1;color:var(--text);font-weight:700}
.qty-preset-grid button.is-selected{background:#f6bf83;border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--btn)}
.qty-custom-title{font-weight:700;border-top:1px solid rgba(140,119,98,.35);padding-top:10px}
.qty-custom-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.qty-custom-input{width:100%;min-width:0;height:50px;border:2px solid rgba(140,119,98,.68);border-radius:11px;background:#fffdf8;text-align:center;padding:4px;outline:none}
.qty-custom-input::placeholder{font-size:.8em}
.qty-manager-status{min-height:1.3em;text-align:center;color:#9a3d31;font-weight:700}
.qty-manager-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px}
.qty-manager-actions button{min-height:60px;border:2px solid var(--btn);border-radius:13px;font-weight:700}
#clearQtySelectionBtn{background:#fffaf1;color:var(--text)}
#applyQtySelectionBtn{background:var(--btn);color:#fff}
.qty-mascot-row{min-height:96px}
@media(max-width:430px){
  .calc-v2-wrap :is(.calc-half-head,.calc-v2-row,.unit-price-box,.calc-manage-inline,.calc-back-inline,.calc-bubble),
  .qty-manager-wrap :is(.qty-manager-note,.qty-preset-grid button,.qty-custom-title,.qty-custom-input,.qty-manager-actions button,.calc-bubble){font-size:clamp(.82rem,3.45vw,1.08rem)}
  .calc-special-row{font-size:clamp(.76rem,3.2vw,1rem)}
}
@media(max-height:700px){
  .calc-half{grid-template-rows:38px minmax(0,1fr)}
  .calc-half-right{grid-template-rows:38px minmax(0,1fr) minmax(38px,.9fr)}
  .calc-half-body{grid-template-rows:repeat(5,minmax(34px,1fr))}
  .calc-half-right .calc-half-body{grid-template-rows:repeat(4,minmax(34px,1fr))}
  .unit-price-box,.calc-manage-inline,.calc-control-v2 .calc-back-inline{min-height:52px}
  .unit-input-v2{height:34px}
  .qty-manager-card{gap:7px;padding:8px}
  .qty-preset-grid{gap:6px}.qty-preset-grid button{min-height:44px}
  .qty-custom-grid{gap:6px}.qty-custom-input{height:40px}
  .qty-manager-actions button{min-height:50px}
}


/* ===== 計算表 最終版復元 2026-09-06 ===== */
.calc-v2-wrap{grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:8px}
.calc-dual-table{gap:8px}
.calc-half,.calc-half-right{display:grid;grid-template-rows:46px minmax(0,1fr);border:2px solid rgba(140,119,98,.55);border-radius:16px;overflow:hidden;background:#fffaf1;gap:0}
.calc-half-right>.calc-half-head,.calc-half-right>.calc-half-body{border:0;border-radius:0}
.calc-half-body,.calc-half-right .calc-half-body{grid-template-rows:repeat(5,minmax(44px,1fr))}
.calc-sub-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-special-row{min-height:82px;grid-template-columns:auto 1fr;padding:0 14px;border-radius:13px;font-size:1.34rem}
.calc-special-row span{padding:0;white-space:nowrap}
.calc-special-amount{border-left:0;padding:0 0 0 16px;justify-content:flex-start}
.calc-manage-inline{min-height:82px;font-size:1.34rem}
.calc-control-v2{grid-template-columns:1fr 1fr;gap:8px}

<script>
const input=document.getElementById('input');
const output=document.getElementById('output');
const copyBtn=document.getElementById('copyBtn');
const shareBtn=document.getElementById('shareBtn');

const status=document.getElementById('status');
const count=document.getElementById('count');
const authGate=document.getElementById('authGate');
const authForm=document.getElementById('authForm');
const authPassword=document.getElementById('authPassword');
const authError=document.getElementById('authError');
const AUTH_KEY='portal-auth-ok-v1';
const AUTH_PASSWORD='19781211';

function openAuthIfNeeded(){
  if(localStorage.getItem(AUTH_KEY)==='1') return;
  authGate.classList.add('is-open');
  document.body.style.overflow='hidden';
  setTimeout(()=>authPassword.focus(),0);
}
authForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(authPassword.value===AUTH_PASSWORD){
    localStorage.setItem(AUTH_KEY,'1');
    authGate.classList.remove('is-open');
    document.body.style.overflow='';
    authError.textContent='';
    authPassword.value='';
  }else{
    authError.textContent='パスワードが違います';
    authPassword.select();
  }
});

function normalizeMarkdownUrls(text){
  return text.replace(/\[([^\]]*https?:\/\/[^\]]+)\]\((https?:\/\/[^)]+)\)/g,'$2');
}
function extractPairs(text){
  text=normalizeMarkdownUrls(text).replace(/\r\n?/g,'\n').replace(/\u200b/g,'');
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const pairs=[]; let pendingNum=null;
  for(const line of lines){
    const sameLine=line.match(/^(\d+)\s+(https?:\/\/[^\s<>"']+)/i);
    if(sameLine){pairs.push({num:sameLine[1],url:sameLine[2]});pendingNum=null;continue}
    const numMatch=line.match(/^(\d+)\s*$/);
    if(numMatch){pendingNum=numMatch[1];continue}
    const urlMatch=line.match(/(https?:\/\/[^\s<>"']+)/i);
    if(urlMatch){pairs.push({num:pendingNum,url:urlMatch[1]});pendingNum=null}
  }
  if(pairs.length===0){
    const urls=text.match(/https?:\/\/[^\s<>"')\]]+/gi)||[];
    urls.forEach((url,i)=>pairs.push({num:String(i+1),url}));
  }
  return pairs;
}
function format(){
  const pairs=extractPairs(input.value);
  const sep='\n\n';
  output.value=pairs.map((p,i)=>`${p.num||String(i+1)}${sep}${p.url}`).join(sep);
  count.textContent=`${String(pairs.length).replace(/[0-9]/g,d=>String.fromCharCode(d.charCodeAt(0)+0xFEE0))}件`;
  status.textContent='';
}
function clearAll(){
  input.value='';
  output.value='';
  count.textContent='０件';
  status.textContent='';
  input.focus();
}

input.addEventListener('input',format);
clearBtn.addEventListener('click',clearAll);
copyBtn.addEventListener('click',async()=>{
  if(!output.value){status.textContent='内容なし';return}
  try{await navigator.clipboard.writeText(output.value);status.textContent='コピーしました！'}
  catch(e){output.removeAttribute('readonly');output.select();document.execCommand('copy');output.setAttribute('readonly','');status.textContent='コピーしました！'}
  setTimeout(()=>status.textContent='',1800);
});
shareBtn.addEventListener('click',()=>{
  window.open('https://writening.net/','_blank','noopener,noreferrer');
});

}

// ===== 商品名・容量の簡易確認 =====
const couponCheckBtn=document.getElementById('couponCheckBtn');

const COUPON_ANALYZER_API='https://seven-coupon-size-counter.regal-elk-8007.chatgpt.site/api/analyze';
const COUPON_ANALYZER_SITE='https://seven-coupon-size-counter.regal-elk-8007.chatgpt.site';
let couponCheckRunning=false;

function openCouponModal(){
  couponCheckModal.classList.add('is-open');
  couponCheckModal.setAttribute('aria-hidden','false');
}
function closeCouponModal(){
  if(couponCheckRunning)return;
  couponCheckModal.classList.remove('is-open');
  couponCheckModal.setAttribute('aria-hidden','true');
}
function setCouponProgress(done,total,label){
  const percent=total?Math.round(done/total*100):0;
  couponCheckPhase.textContent=label;
  couponProgressCount.textContent=`${done} / ${total}件`;
  couponProgressPercent.textContent=`${percent}%`;
  couponProgressBar.style.width=`${percent}%`;
}
function getCouponItems(){
  const seen=new Set();
  return extractPairs(input.value).flatMap((pair,index)=>{
    try{
      const url=new URL(pair.url.replace(/[.,;]+$/,''));
      const isSeven=url.protocol==='https:'&&url.hostname==='coupon.sej.co.jp'&&url.pathname==='/order/cpnsp_03.do'&&url.searchParams.has('hansoku_id');
      const isFamima=url.protocol==='https:'&&url.hostname==='ncpfa.famima.com'&&url.pathname==='/prd/ebcweb'&&['eKey','cpNo','gyNo'].every(key=>url.searchParams.has(key));
      if((!isSeven&&!isFamima)||seen.has(url.href))return[];
      seen.add(url.href);
      const label=/^\d{1,5}$/.test(pair.num||'')?pair.num:String(index+1);
      return[{label,url:url.href}];
    }catch(e){return[]}
  });
}
function couponResolved(item){
  return item.status==='used'||(item.status==='ok'&&['350','500','other','none'].includes(item.size)&&item.product!=='商品名不明');
}
async function analyzeCouponPass(items,label){
  const results=new Array(items.length);
  let cursor=0;
  let completed=0;
  setCouponProgress(0,items.length,label);
  async function worker(){
    while(cursor<items.length){
      const index=cursor++;
      const item=items[index];
      try{
        const response=await fetch(COUPON_ANALYZER_API,{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({items:[item]})
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.results?.[0])throw new Error(data.error||'確認に失敗しました');
        results[index]=data.results[0];
      }catch(error){
        results[index]={...item,product:'商品名不明',size:'unknown',status:'error',message:error instanceof Error?error.message:'確認に失敗しました'};
      }
      completed+=1;
      setCouponProgress(completed,items.length,label);
    }
  }
  await Promise.all(Array.from({length:Math.min(4,items.length)},worker));
  return results;
}
function addCouponResultRow(product,size,count){
  const row=document.createElement('tr');
  [product,size,`${count}本`].forEach(value=>{
    const cell=document.createElement('td');
    cell.textContent=value;
    row.appendChild(cell);
  });
  couponResultRows.appendChild(row);
}
function renderCouponResults(items,elapsedMs){
  const groups=new Map();
  items.forEach(item=>{
    let product='商品名不明';
    let size='判定不能';
    if(item.status==='used'){product='利用済み';size='—'}
    else if(couponResolved(item)){
      product=item.product;
      size=item.size==='350'?'350ml':item.size==='500'?'500ml':item.size==='other'?(item.capacity||'その他'):item.size==='none'?'容量表記なし':'判定不能';
    }
    const key=`${product}\u0000${size}`;
    const group=groups.get(key)||{product,size,count:0};
    group.count+=1;
    groups.set(key,group);
  });
  couponResultRows.innerHTML='';
  [...groups.values()]
    .sort((a,b)=>{
      if(a.product==='商品名不明')return 1;
      if(b.product==='商品名不明')return-1;
      if(a.product==='利用済み')return 1;
      if(b.product==='利用済み')return-1;
      return a.product.localeCompare(b.product,'ja')||b.size.localeCompare(a.size,'ja');
    })
    .forEach(group=>addCouponResultRow(group.product,group.size,group.count));
  const unresolved=items.filter(item=>!couponResolved(item)).length;
  couponResultTotal.textContent=`URL合計 ${items.length}件`;
  couponResultTime.textContent=`確認時間 ${Math.max(1,Math.round(elapsedMs/1000))}秒`;
  couponResultNote.textContent=unresolved
    ? `${unresolved}件は2回再確認しても判定できませんでした。必要に応じて大元サイトで確認してください。`
    : 'すべての商品名と容量を確認できました。';
  couponCheckResult.hidden=false;
}
async function runCouponCheck(){
  if(couponCheckRunning)return;
  const items=getCouponItems();
  openCouponModal();
  couponCheckError.hidden=true;
  couponCheckResult.hidden=true;
  couponProgressBox.hidden=false;
  couponCheckX.disabled=true;
  couponCheckClose.disabled=true;
  couponCheckMain.disabled=true;
  if(!items.length){
    couponProgressBox.hidden=true;
    couponCheckPhase.textContent='確認できませんでした';
    couponCheckError.textContent='貼り付け欄にセブンまたはファミマのクーポンURLが見つかりません。';
    couponCheckError.hidden=false;
    couponCheckX.disabled=false;
    couponCheckClose.disabled=false;
    couponCheckMain.disabled=false;
    return;
  }
  couponCheckRunning=true;
  const started=performance.now();
  let finalByUrl=new Map();
  let pending=items;
  for(let pass=0;pass<=2&&pending.length;pass+=1){
    const label=pass===0?'初回解析中':`再解析中（${pass}/2）`;
    const passResults=await analyzeCouponPass(pending,label);
    passResults.forEach(item=>finalByUrl.set(item.url,item));
    pending=passResults.filter(item=>!couponResolved(item)).map(item=>({label:item.label,url:item.url}));
  }
  const ordered=items.map(item=>finalByUrl.get(item.url)||({...item,product:'商品名不明',size:'unknown',status:'error'}));
  setCouponProgress(items.length,items.length,'解析完了');
  renderCouponResults(ordered,performance.now()-started);
  couponCheckRunning=false;
  couponCheckX.disabled=false;
  couponCheckClose.disabled=false;
  couponCheckMain.disabled=false;
}
couponCheckBtn.addEventListener('click',runCouponCheck);
couponCheckX.addEventListener('click',closeCouponModal);
couponCheckClose.addEventListener('click',closeCouponModal);
couponCheckMain.addEventListener('click',()=>window.open(COUPON_ANALYZER_SITE,'_blank','noopener,noreferrer'));
couponCheckModal.addEventListener('click',event=>{if(event.target===couponCheckModal)closeCouponModal()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&couponCheckModal.classList.contains('is-open'))closeCouponModal()});


// ===== 計算表 =====
const openCalcBtn=document.getElementById('openCalcBtn');
const calculatorScreen=document.getElementById('calculatorScreen');
const qtyManagerScreen=document.getElementById('qtyManagerScreen');
const unitPrice=document.getElementById('unitPrice');
const unit80=document.getElementById('unit80');
const calcLeftRows=document.getElementById('calcLeftRows');
const calcRightRows=document.getElementById('calcRightRows');
const openQtyManagerBtn=document.getElementById('openQtyManagerBtn');
const closeQtyManagerBtn=document.getElementById('closeQtyManagerBtn');
const qtyPresetGrid=document.getElementById('qtyPresetGrid');
const qtyCustomInputs=[...document.querySelectorAll('.qty-custom-input')];
const qtyManagerStatus=document.getElementById('qtyManagerStatus');
const clearQtySelectionBtn=document.getElementById('clearQtySelectionBtn');
const applyQtySelectionBtn=document.getElementById('applyQtySelectionBtn');
const QTY_KEY='calc-display-qty-final-v1';
const DEFAULT_QTYS=[2,3,4,5,10,20,24,48,100,500];
let selectedPreset=new Set();
let displayQtys=loadDisplayQtys();

function toHalfDigits(value){
  return String(value??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,'');
}
function toFullDigits(value){
  return String(value??'').replace(/[0-9]/g,c=>String.fromCharCode(c.charCodeAt(0)+0xFEE0));
}
function fullNumber(value){
  const n=Math.max(0,Math.round(Number(value)||0));
  return toFullDigits(n.toLocaleString('ja-JP'));
}
function parseNumericInput(el){
  return Math.max(0,Number(toHalfDigits(el.value))||0);
}
function normalizeFullInput(el){
  const raw=toHalfDigits(el.value);
  el.value=toFullDigits(raw);
}
document.querySelectorAll('.fw-input').forEach(el=>el.addEventListener('input',()=>normalizeFullInput(el)));

function loadDisplayQtys(){
  try{
    const saved=JSON.parse(localStorage.getItem(QTY_KEY)||'null');
    if(Array.isArray(saved)){
      const clean=[...new Set(saved.map(Number).filter(n=>Number.isFinite(n)&&n>0))].sort((a,b)=>a-b).slice(0,10);
      if(clean.length) return clean;
    }
  }catch(e){}
  return [...DEFAULT_QTYS];
}
function calcYen(value){return `${fullNumber(value)}円`}
function makeCalcRow(qty){
  const row=document.createElement('div');
  row.className='calc-v2-row';
  const q=document.createElement('span');
  q.textContent=qty?`${fullNumber(qty)}本`:'－';
  const a=document.createElement('span');
  a.className='calc-v2-amount';
  a.dataset.qty=qty||'';
  a.textContent=qty?'０円':'－';
  row.append(q,a);
  return row;
}
function renderCalcRows(){
  calcLeftRows.innerHTML=''; calcRightRows.innerHTML='';
  const slots=[...displayQtys].sort((a,b)=>a-b).slice(0,10);
  while(slots.length<10) slots.push(null);
  slots.slice(0,5).forEach(q=>calcLeftRows.appendChild(makeCalcRow(q)));
  slots.slice(5,10).forEach(q=>calcRightRows.appendChild(makeCalcRow(q)));
  updateCalculator();
}
function updateCalculator(){
  const unit=parseNumericInput(unitPrice);
  document.querySelectorAll('.calc-v2-amount[data-qty]').forEach(el=>{
    const qty=Number(el.dataset.qty)||0;
    if(qty) el.textContent=calcYen(qty*unit);
  });
  unit80.textContent=calcYen(unit*0.8);
}
function openCalculator(){
  calculatorScreen.classList.add('is-open');
  calculatorScreen.setAttribute('aria-hidden','false');
  renderCalcRows();
}
function closeCalculator(){
  qtyManagerScreen.classList.remove('is-open');
  qtyManagerScreen.setAttribute('aria-hidden','true');
  calculatorScreen.classList.remove('is-open');
  calculatorScreen.setAttribute('aria-hidden','true');
}
function openQtyManager(){
  selectedPreset=new Set(displayQtys.filter(q=>qtyPresetGrid.querySelector(`[data-qty="${q}"]`)));
  qtyPresetGrid.querySelectorAll('button').forEach(btn=>btn.classList.toggle('is-selected',selectedPreset.has(Number(btn.dataset.qty))));
  const custom=displayQtys.filter(q=>!selectedPreset.has(q));
  qtyCustomInputs.forEach((input,i)=>input.value=custom[i]?fullNumber(custom[i]):'');
  qtyManagerStatus.textContent='';
  qtyManagerScreen.classList.add('is-open');
  qtyManagerScreen.setAttribute('aria-hidden','false');
}
function closeQtyManager(){
  qtyManagerScreen.classList.remove('is-open');
  qtyManagerScreen.setAttribute('aria-hidden','true');
}
function gatherManagerQtys(){
  const preset=[...selectedPreset];
  const custom=qtyCustomInputs.map(parseNumericInput).filter(n=>n>0);
  return [...new Set([...preset,...custom])].sort((a,b)=>a-b);
}
qtyPresetGrid.addEventListener('click',e=>{
  const btn=e.target.closest('button[data-qty]'); if(!btn)return;
  const n=Number(btn.dataset.qty);
  if(selectedPreset.has(n)){selectedPreset.delete(n);btn.classList.remove('is-selected');qtyManagerStatus.textContent='';return}
  const current=gatherManagerQtys();
  if(current.length>=9){qtyManagerStatus.textContent='最大９つまで選択できます';return}
  selectedPreset.add(n);btn.classList.add('is-selected');qtyManagerStatus.textContent='';
});
qtyCustomInputs.forEach(input=>input.addEventListener('change',()=>{
  if(gatherManagerQtys().length>9){input.value='';qtyManagerStatus.textContent='最大９つまで選択できます'}else qtyManagerStatus.textContent='';
}));
clearQtySelectionBtn.addEventListener('click',()=>{
  selectedPreset.clear();qtyPresetGrid.querySelectorAll('button').forEach(b=>b.classList.remove('is-selected'));
  qtyCustomInputs.forEach(i=>i.value='');qtyManagerStatus.textContent='';
});
applyQtySelectionBtn.addEventListener('click',()=>{
  const qtys=gatherManagerQtys();
  if(qtys.length>9){qtyManagerStatus.textContent='最大９つまで選択できます';return}
  displayQtys=qtys;
  localStorage.setItem(QTY_KEY,JSON.stringify(displayQtys));
  renderCalcRows();closeQtyManager();
});
openCalcBtn.addEventListener('click',openCalculator);
document.querySelectorAll('.jsCalcBack').forEach(btn=>btn.addEventListener('click',closeCalculator));
openQtyManagerBtn.addEventListener('click',openQtyManager);
closeQtyManagerBtn.addEventListener('click',closeQtyManager);
unitPrice.addEventListener('input',updateCalculator);
renderCalcRows();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
openAuthIfNeeded();
format();
</script>
