<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>URL改行整形ツール</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --text:#111827;
      --sub:#6b7280;
      --border:#d1d5db;
      --btn:#111827;
      --btnText:#ffffff;
      --ok:#166534;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{
      min-height:100dvh;
    }

    .app{
      height:100dvh;
      max-width:820px;
      margin:0 auto;
      padding:
        max(8px, env(safe-area-inset-top))
        10px
        max(8px, env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:auto 1fr 1fr;
      gap:8px;
      overflow:hidden;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      min-height:34px;
    }

    h1{
      margin:0;
      font-size:18px;
      line-height:1.2;
    }

    .small{
      color:var(--sub);
      font-size:12px;
      white-space:nowrap;
    }

    .card{
      min-height:0;
      background:var(--card);
      border-radius:14px;
      padding:9px;
      box-shadow:0 1px 8px rgba(0,0,0,.06);
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:6px;
      overflow:hidden;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      min-height:28px;
    }

    label{
      font-size:15px;
      font-weight:800;
    }

    textarea{
      width:100%;
      height:100%;
      min-height:0;
      resize:none;
      border:1px solid var(--border);
      border-radius:10px;
      padding:9px 10px;
      font-size:15px;
      line-height:1.4;
      background:#fff;
      color:#111827;
      outline:none;
    }

    textarea:focus{
      border-color:#9ca3af;
    }

    .bottom-row{
      display:flex;
      align-items:center;
      gap:7px;
      min-height:36px;
    }

    .primary,
    .secondary{
      border:none;
      border-radius:10px;
      min-height:36px;
      padding:8px 12px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }

    .primary{
      flex:1;
      background:var(--btn);
      color:var(--btnText);
    }

    .secondary{
      background:#e5e7eb;
      color:#111827;
    }

    .status{
      flex:1;
      min-width:0;
      color:var(--ok);
      font-size:12px;
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-align:right;
    }

    .option{
      display:flex;
      align-items:center;
      gap:5px;
      font-size:12px;
      color:var(--sub);
      white-space:nowrap;
    }

    .option input{
      width:17px;
      height:17px;
      margin:0;
    }

    @media (max-height: 650px){
      .app{
        padding-top:5px;
        padding-bottom:5px;
        gap:5px;
      }

      h1{font-size:16px}
      .header{min-height:28px}
      .card{padding:7px;gap:4px;border-radius:11px}
      .section-head{min-height:24px}
      label{font-size:14px}
      textarea{font-size:14px;padding:7px 8px}
      .bottom-row{min-height:32px}
      .primary,.secondary{
        min-height:32px;
        padding:6px 10px;
        font-size:13px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <h1>URL改行整形ツール</h1>
      <div class="small" id="count">0件</div>
    </div>

    <!-- 上：整形結果 -->
    <section class="card">
      <div class="section-head">
        <label for="output">① 整形結果</label>
      </div>

      <textarea id="output" readonly placeholder="貼り付けると、ここに自動で結果が出ます"></textarea>

      <div class="bottom-row">
        <button class="primary" id="copyBtn">整形結果をコピー</button>
        <div class="status" id="status"></div>
      </div>
    </section>

    <!-- 下：貼り付け -->
    <section class="card">
      <div class="section-head">
        <label for="input">② ここに貼り付け</label>

        <div class="option">
          <input type="checkbox" id="blankLine" checked>
          <label for="blankLine" style="font-size:12px;font-weight:600;">空行あり</label>
        </div>
      </div>

      <textarea id="input" placeholder="1
https://example.com/aaa
2
https://example.com/bbb"></textarea>

      <div class="bottom-row">
        <button class="secondary" id="clearBtn">クリア</button>
        <div class="status">貼り付けるだけで自動整形</div>
      </div>
    </section>
  </main>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const blankLine = document.getElementById('blankLine');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const status = document.getElementById('status');
const count = document.getElementById('count');

function normalizeMarkdownUrls(text){
  return text.replace(
    /\[([^\]]*https?:\/\/[^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '$2'
  );
}

function extractPairs(text){
  text = normalizeMarkdownUrls(text)
    .replace(/\r\n?/g, '\n')
    .replace(/\u200b/g, '');

  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const pairs = [];
  let pendingNum = null;

  for (const line of lines){
    const sameLine = line.match(/^(\d+)\s+(https?:\/\/[^\s<>"']+)/i);
    if (sameLine){
      pairs.push({num:sameLine[1], url:sameLine[2]});
      pendingNum = null;
      continue;
    }

    const numMatch = line.match(/^(\d+)\s*$/);
    if (numMatch){
      pendingNum = numMatch[1];
      continue;
    }

    const urlMatch = line.match(/(https?:\/\/[^\s<>"']+)/i);
    if (urlMatch){
      pairs.push({num:pendingNum, url:urlMatch[1]});
      pendingNum = null;
    }
  }

  if (pairs.length === 0){
    const urls = text.match(/https?:\/\/[^\s<>"')\]]+/gi) || [];
    urls.forEach((url, i) => pairs.push({num:String(i+1), url}));
  }

  return pairs;
}

function format(){
  const pairs = extractPairs(input.value);
  const sep = blankLine.checked ? '\n\n' : '\n';

  output.value = pairs.map((p, i) => {
    const n = p.num || String(i + 1);
    return `${n}${sep}${p.url}`;
  }).join(sep);

  count.textContent = `${pairs.length}件`;
  status.textContent = '';
}

input.addEventListener('input', format);
blankLine.addEventListener('change', format);

clearBtn.addEventListener('click', () => {
  input.value = '';
  output.value = '';
  count.textContent = '0件';
  status.textContent = '';
  input.focus();
});

copyBtn.addEventListener('click', async () => {
  if (!output.value){
    status.textContent = '内容なし';
    return;
  }

  try{
    await navigator.clipboard.writeText(output.value);
    status.textContent = 'コピーしました！';
  }catch(e){
    output.removeAttribute('readonly');
    output.select();
    document.execCommand('copy');
    output.setAttribute('readonly', '');
    status.textContent = 'コピーしました！';
  }

  setTimeout(() => {
    status.textContent = '';
  }, 1800);
});

format();
</script>
</body>
</html>
