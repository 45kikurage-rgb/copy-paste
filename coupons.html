<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde0b6">
<meta name="description" content="家族で共有できる自己利用分クーポン管理">
<title>自己利用分 | ポータルサイト</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./shisa-maskable.png">
<link rel="apple-touch-icon" href="./shisa-maskable.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./coupon.css">
<link rel="stylesheet" href="./coupon-edit.css">
</head>
<body>
<main class="coupon-app" id="couponApp">
  <header class="coupon-top">
    <button class="coupon-back" id="homeBtn" type="button">◀ 戻る</button>
    <div class="coupon-title">自己利用分</div>
    <button class="coupon-add-top" id="openAddBtn" type="button" aria-label="クーポンを追加">＋</button>
  </header>
  <p class="page-status" id="pageStatus" aria-live="polite">読み込み中...</p>
  <section class="coupon-list" id="couponList" aria-label="クーポン一覧"></section>
</main>

<section class="screen" id="addScreen" aria-hidden="true">
  <div class="screen-wrap">
    <header class="coupon-top">
      <button class="coupon-back" id="closeAddBtn" type="button">◀ 戻る</button>
      <div class="coupon-title">クーポン追加</div>
      <div></div>
    </header>
    <form class="form-card" id="couponForm">
      <label class="field">クーポン名
        <input name="name" type="text" maxlength="100" required autocomplete="off">
      </label>
      <label class="field">代表画像
        <input name="coverImage" type="file" accept="image/*" required>
      </label>
      <label class="field">利用期限
        <input name="expiresOn" id="expiresOn" type="date" required>
      </label>
      <label class="field">クーポンの種類
        <select name="type" id="couponType" required>
          <option value="url">URL型</option>
          <option value="image">画像型</option>
        </select>
      </label>
      <label class="field type-fields" id="urlFields">利用URL
        <textarea name="urls" placeholder="URLを1行に1件ずつ貼り付け"></textarea>
        <span class="field-note">複数URLは改行区切りで一括登録できます。</span>
      </label>
      <label class="field type-fields" id="imageFields" hidden>利用用クーポン画像
        <input name="couponImages" type="file" accept="image/*" multiple>
        <span class="field-note">複数の画像をまとめて選択できます。</span>
      </label>
      <div class="registration-result" id="registrationResult" aria-live="polite"></div>
      <div class="form-actions">
        <button class="dialog-btn is-soft" id="cancelAddBtn" type="button">キャンセル</button>
        <button class="form-submit" id="registerBtn" type="submit">登録する</button>
      </div>
    </form>
  </div>
</section>

<div class="reservation-layer" id="reservationLayer" role="dialog" aria-modal="true" aria-labelledby="reservationTitle">
  <div class="reservation-card">
    <h2 class="reservation-title" id="reservationTitle">クーポンを利用</h2>
    <div class="reservation-summary" id="reservationSummary"></div>
    <div id="quantitySection" hidden>
      <div class="quantity-control">
        <button id="quantityMinus" type="button" aria-label="1枚減らす">－</button>
        <input id="quantityInput" type="number" inputmode="numeric" min="1" value="1" aria-label="利用枚数">
        <button id="quantityPlus" type="button" aria-label="1枚増やす">＋</button>
      </div>
    </div>
    <button class="dialog-btn is-accent" id="reserveBtn" type="button">予約して利用する</button>
    <button class="dialog-btn download-btn" id="downloadBtn" type="button" hidden>画像をダウンロード</button>
    <div class="reservation-actions" id="useActions" hidden>
      <button class="dialog-btn is-soft" id="cancelReservationBtn" type="button">キャンセル</button>
      <button class="dialog-btn" id="usedBtn" type="button">利用した</button>
    </div>
    <div class="reservation-actions" id="confirmActions" hidden>
      <button class="dialog-btn is-soft" id="cancelAfterUsedBtn" type="button">キャンセル</button>
      <button class="dialog-btn confirm-btn" id="confirmBtn" type="button">確認</button>
    </div>
    <button class="dialog-btn is-soft" id="closeReservationBtn" type="button">閉じる</button>
    <div class="reservation-message" id="reservationMessage" aria-live="polite"></div>
  </div>
</div>

<script src="./coupon-config.js"></script>
<script src="./coupon.js"></script>
<script src="./coupon-edit.js"></script>
</body>
</html>
