<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fde0b6">
<title>クーポン登録</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#fde0b6;--card:#fffaf1;--text:#282018;--sub:#776a5e;--border:#8c7762;--btn:#3c3026;--ok:#3f7f51;--ng:#9a3d31}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Yomogi","Klee One","Yu Mincho",cursive}
body{min-height:100dvh;display:grid;place-items:center;padding:18px}
.card{width:min(100%,520px);padding:20px;border:2px solid rgba(140,119,98,.55);border-radius:20px;background:var(--card);box-shadow:0 6px 18px rgba(88,58,31,.12);display:grid;gap:14px}
h1{margin:0;text-align:center;font-size:1.35rem}.status{text-align:center;font-weight:700;font-size:1.04rem}
.detail{display:grid;gap:7px;padding:12px;border:2px solid rgba(140,119,98,.35);border-radius:13px;background:#fffdf8}
.row{display:grid;grid-template-columns:78px 1fr;gap:8px}.label{color:var(--sub);font-weight:700}.value{font-weight:700;overflow-wrap:anywhere}
.spinner{width:42px;height:42px;margin:4px auto;border:4px solid rgba(60,48,38,.18);border-top-color:var(--btn);border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.ok{color:var(--ok)}.error{color:var(--ng)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:48px;border:2px solid var(--btn);border-radius:11px;background:var(--btn);color:#fff;font:inherit;font-weight:700}
.btn.soft{background:var(--card);color:var(--text)}.note{text-align:center;color:var(--sub);font-size:.82rem;line-height:1.45}
</style>
</head>
<body>
<main class="card">
  <h1>クーポン自動登録</h1>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">共有されたリンクを確認しています...</div>
  <section class="detail" id="detail" hidden>
    <div class="row"><div class="label">商品名</div><div class="value" id="product"></div></div>
    <div class="row"><div class="label">引換先</div><div class="value" id="place"></div></div>
    <div class="row"><div class="label">期限</div><div class="value" id="expiry"></div></div>
  </section>
  <div class="actions" id="actions" hidden>
    <button class="btn soft" id="portalBtn" type="button">ポータルへ</button>
    <button class="btn" id="listBtn" type="button">自己利用分を見る</button>
  </div>
  <div class="note" id="note">同じURLは重複登録しません。</div>
</main>
<script src="./coupon-config.js"></script>
<script>
(() => {
  'use strict';
  const MANAGER_API=String(window.COUPON_API_BASE||'').replace(/\/$/,'');
  const ANALYZER_BASE='https://coupon-capture.45kikurage.workers.dev';
  const status=document.getElementById('status');
  const spinner=document.getElementById('spinner');
  const detail=document.getElementById('detail');
  const actions=document.getElementById('actions');
  const product=document.getElementById('product');
  const place=document.getElementById('place');
  const expiry=document.getElementById('expiry');
  const note=document.getElementById('note');

  function extractUrl(){
    const params=new URLSearchParams(location.search);
    const values=[params.get('url'),params.get('text'),params.get('title')].filter(Boolean);
    for(const value of values){
      const match=String(value).match(/https:\/\/[^\s<>"']+/i);
      if(match) return match[0].replace(/[.,;、。\])}]+$/,'');
    }
    return '';
  }
  async function jsonFetch(url,options){
    const response=await fetch(url,options);
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||`通信エラー（${response.status}）`);
    return data;
  }
  function placeForSite(site,brand=''){
    if(site==='seven') return 'セブンイレブン';
    if(site==='familymart') return 'ファミリーマート';
    if(site==='misterdonut') return 'ミスタードーナツ';
    if(site==='giftee_box') return brand||'giftee Box';
    return brand||'';
  }
  function tokyoToday(){
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const get=type=>Number(parts.find(part=>part.type===type)?.value||0);
    return{year:get('year'),month:get('month'),day:get('day')};
  }
  function validIsoDate(year,month,day){
    const date=new Date(Date.UTC(year,month-1,day));
    if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return'';
    return `${String(year).padStart(4,'0')}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  function inferYear(month,day){
    const today=tokyoToday();
    let year=today.year;
    const candidate=new Date(Date.UTC(year,month-1,day));
    const base=new Date(Date.UTC(today.year,today.month-1,today.day));
    if(Math.floor((candidate-base)/86400000)<-31)year+=1;
    return year;
  }
  function extractExpiry(text){
    const normalized=String(text||'').normalize('NFKC');
    const dates=[];
    for(const match of normalized.matchAll(/(20\d{2})\s*[年\/.-]\s*(\d{1,2})\s*[月\/.-]\s*(\d{1,2})\s*日?/g)){
      const iso=validIsoDate(Number(match[1]),Number(match[2]),Number(match[3]));
      if(iso)dates.push(iso);
    }
    for(const match of normalized.matchAll(/(?:^|[^0-9])(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?/g)){
      const month=Number(match[1]),day=Number(match[2]);
      if(month<1||month>12||day<1||day>31)continue;
      const iso=validIsoDate(inferYear(month,day),month,day);
      if(iso)dates.push(iso);
    }
    return dates.length?[...new Set(dates)].sort().at(-1):'';
  }
  function decodeBase64Text(value){
    try{
      const binary=atob(String(value||''));
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }catch{return''}
  }
  function productImageFromSvg(svg){
    const exact=String(svg||'').match(/<image\s+href="(data:image\/(?:png|jpeg|webp);base64,[^"]+)"\s+x="80"\s+y="250"/i);
    if(exact)return exact[1];
    const generic=[...String(svg||'').matchAll(/<image\b[^>]*href="(data:image\/(?:png|jpeg|webp);base64,[^"]+)"[^>]*>/gi)];
    return generic[0]?.[1]||null;
  }
  function productTitleFromSvg(svg){
    const rows=[...String(svg||'').matchAll(/<text\b[^>]*y="(9\d{2}|10\d{2})"[^>]*>([^<]+)<\/text>/gi)]
      .map(m=>({y:Number(m[1]),value:m[2].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").trim()}))
      .filter(x=>x.value)
      .sort((a,b)=>a.y-b.y);
    return rows.map(x=>x.value).join(' ').trim();
  }
  async function analyzeLegacy(url){
    let captured=null;
    try{
      captured=await jsonFetch(`${ANALYZER_BASE}/api/capture-one`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url,mode:'fast'})
      });
      const svg=captured.base64?decodeBase64Text(captured.base64):'';
      const product=(captured.product||captured.title||productTitleFromSvg(svg)||'').trim();
      const expiresOn=extractExpiry(Array.isArray(captured.period)?captured.period.join('\n'):svg);
      if(product&&product!=='商品名不明'&&expiresOn){
        return{
          product,
          redeemPlace:placeForSite(captured.site),
          expiresOn,
          productImageDataUri:captured.productImageDataUri||productImageFromSvg(svg)
        };
      }
    }catch{}

    const analyzed=await jsonFetch(`${ANALYZER_BASE}/api/analyze`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:[{label:'1',url}]})
    });
    const item=analyzed.results?.[0];
    if(!item)throw new Error('商品情報を読み取れませんでした。');
    if(item.status==='used')throw new Error('このクーポンは利用済みです。');
    if(item.status!=='ok'||!item.product||item.product==='商品名不明')throw new Error(item.message||'商品名を読み取れませんでした。');

    const svg=captured?.base64?decodeBase64Text(captured.base64):'';
    const expiresOn=extractExpiry(svg);
    if(!expiresOn)throw new Error('利用期限を読み取れませんでした。');
    return{
      product:item.product,
      redeemPlace:placeForSite(item.site,item.brand),
      expiresOn,
      productImageDataUri:captured?.productImageDataUri||productImageFromSvg(svg)
    };
  }

  function showResult(data,message,isError=false){
    spinner.hidden=true;
    status.textContent=message;
    status.className='status '+(isError?'error':'ok');
    if(data){
      product.textContent=data.product||data.name||'—';
      place.textContent=data.redeemPlace||'—';
      expiry.textContent=(data.expiresOn||'—').replace(/-/g,'/');
      detail.hidden=false;
    }
    actions.hidden=false;
  }
  async function run(){
    const url=extractUrl();
    if(!url){showResult(null,'共有されたURLを確認できませんでした。',true);return}
    if(!MANAGER_API){showResult(null,'自己利用分APIが設定されていません。',true);return}
    try{
      status.textContent='商品名・引換先・期限・画像を解析して登録しています...';
      let registered;
      try{
        registered=await jsonFetch(`${MANAGER_API}/api/coupons/register-auto`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({url})
        });
      }catch(primaryError){
        status.textContent='互換解析で再確認しています...';
        const analyzed=await analyzeLegacy(url);
        registered=await jsonFetch(`${MANAGER_API}/api/coupons/register-auto`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            name:analyzed.product,
            redeemPlace:analyzed.redeemPlace,
            expiresOn:analyzed.expiresOn,
            url,
            productImageDataUri:analyzed.productImageDataUri
          })
        });
      }
      const result={
        product:registered.product||registered.name||'',
        redeemPlace:registered.redeemPlace||'',
        expiresOn:registered.expiresOn||''
      };
      if(registered.newCount>0){
        showResult(result,'登録しました。');
        note.textContent=registered.imageSaved?'商品画像も保存しました。':'商品画像を取得できなかったため仮画像で登録しました。';
      }else{
        showResult(result,'このURLは登録済みです。');
        note.textContent='同じURLは追加していません。';
      }
      setTimeout(()=>{ location.href='./coupons.html'; },1800);
    }catch(error){
      showResult(null,error.message||'登録に失敗しました。',true);
      note.textContent='解析できないクーポンは、現在の「＋」から手動登録できます。';
    }
  }
  document.getElementById('portalBtn').addEventListener('click',()=>location.href='./');
  document.getElementById('listBtn').addEventListener('click',()=>location.href='./coupons.html');
  run();
})();
</script>
</body>
</html>
